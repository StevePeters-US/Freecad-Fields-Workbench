<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" version="1.1">
    <defs>
        <radialGradient id="primGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#e2e8f0"/>
            <stop offset="100%" stop-color="#94a3b8"/>
        </radialGradient>
    </defs>
    <!-- Interior 3D Primitive (Sphere) -->
    <circle cx="32" cy="33" r="14" style="fill:url(#primGrad);stroke:#94a3b8;stroke-width:1.5"/>

    <!-- Isometric 3D Cage Net Frame -->
    <!-- Outer silhouette -->
    <path d="M 32 10 L 52 21.5 L 52 44.5 L 32 56 L 12 44.5 L 12 21.5 Z" style="fill:none;stroke:#ffaa00;stroke-width:1.8;stroke-linejoin:round"/>
    
    <!-- Interior visible edges meeting at center -->
    <path d="M 32 33 L 12 21.5 M 32 33 L 52 21.5 M 32 33 L 32 56" style="fill:none;stroke:#ffaa00;stroke-width:1.8;stroke-linejoin:round"/>
    
    <!-- Cage grid subdivision (dashed lines) -->
    <path d="M 32 10 L 32 33" style="fill:none;stroke:#ffaa00;stroke-width:1.2;stroke-dasharray:2.5,2"/>
    <path d="M 22 27.25 L 42 15.75" style="fill:none;stroke:#ffaa00;stroke-width:1.2;stroke-dasharray:2.5,2"/>
    <path d="M 22 15.75 L 42 27.25" style="fill:none;stroke:#ffaa00;stroke-width:1.2;stroke-dasharray:2.5,2"/>
    <path d="M 12 33 L 32 44.5" style="fill:none;stroke:#ffaa00;stroke-width:1.2;stroke-dasharray:2.5,2"/>
    <path d="M 52 33 L 32 44.5" style="fill:none;stroke:#ffaa00;stroke-width:1.2;stroke-dasharray:2.5,2"/>
    <path d="M 22 38.75 L 22 50.25" style="fill:none;stroke:#ffaa00;stroke-width:1.2;stroke-dasharray:2.5,2"/>
    <path d="M 42 38.75 L 42 50.25" style="fill:none;stroke:#ffaa00;stroke-width:1.2;stroke-dasharray:2.5,2"/>

    <!-- Cage Control Vertices (Fields signature interactive handles) -->
    <circle cx="32" cy="10" r="2.8" style="fill:#ffffff;stroke:#ffaa00;stroke-width:1.8"/>
    <circle cx="12" cy="21.5" r="2.8" style="fill:#ffffff;stroke:#ffaa00;stroke-width:1.8"/>
    <circle cx="52" cy="21.5" r="2.8" style="fill:#ffffff;stroke:#ffaa00;stroke-width:1.8"/>
    <circle cx="32" cy="33" r="3.0" style="fill:#ffffff;stroke:#ffaa00;stroke-width:2.0"/>
    <circle cx="12" cy="44.5" r="2.8" style="fill:#ffffff;stroke:#ffaa00;stroke-width:1.8"/>
    <circle cx="52" cy="44.5" r="2.8" style="fill:#ffffff;stroke:#ffaa00;stroke-width:1.8"/>
    <circle cx="32" cy="56" r="2.8" style="fill:#ffffff;stroke:#ffaa00;stroke-width:1.8"/>
