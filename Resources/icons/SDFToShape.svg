<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" version="1.1">
    <defs>
        <radialGradient id="sdfGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e0e0e0"/>
        </radialGradient>
    </defs>
    
    <!-- SDF (Sphere with soft appearance) on the left -->
    <circle cx="20" cy="32" r="14" style="fill:url(#sdfGrad);stroke:#ffaa00;stroke-width:2"/>
    
    <!-- Arrow -->
    <path d="M 36 32 L 44 32 M 40 28 L 44 32 L 40 36" style="fill:none;stroke:#ffaa00;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>
    
    <!-- Shape (Box with hard edges) on the right -->
    <rect x="46" y="24" width="14" height="16" style="fill:#e0e0e0;stroke:#ffaa00;stroke-width:2"/>
    <polyline points="46,24 54,16 68,16" style="fill:none;stroke:#ffaa00;stroke-width:2" transform="translate(-8,8)"/>
    
    <!-- Let's make a better box for the right side -->
    <g transform="translate(42, 28) scale(0.4)">
        <polygon points="32,54 14,44 14,24 32,34" style="fill:#b0b0b0;stroke:#ffaa00;stroke-width:2;stroke-linejoin:round"/>
        <polygon points="32,54 50,44 50,24 32,34" style="fill:url(#sdfGrad);stroke:#ffaa00;stroke-width:2;stroke-linejoin:round"/>
        <polygon points="32,34 50,24 32,14 14,24" style="fill:#ffffff;stroke:#ffaa00;stroke-width:2;stroke-linejoin:round"/>
    </g>
</svg>
