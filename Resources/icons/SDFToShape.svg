<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" version="1.1">
    <defs>
        <radialGradient id="sdfGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e0e0e0"/>
        </radialGradient>
    </defs>
    
    <!-- SDF (Sphere) on the left - Larger and Orange outline -->
    <circle cx="18" cy="32" r="16" style="fill:url(#sdfGrad);stroke:#ffaa00;stroke-width:2.5"/>
    
    <!-- Arrow - Orange -->
    <path d="M 36 32 L 44 32 M 40 28 L 44 32 L 40 36" style="fill:none;stroke:#ffaa00;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>
    
    <!-- Mesh (Box) on the right - Larger and Green outline -->
    <g transform="translate(48, 32) scale(0.65) translate(-32, -34)">
        <polygon points="32,54 14,44 14,24 32,34" style="fill:#b0b0b0;stroke:#55aa00;stroke-width:3;stroke-linejoin:round"/>
        <polygon points="32,54 50,44 50,24 32,34" style="fill:url(#sdfGrad);stroke:#55aa00;stroke-width:3;stroke-linejoin:round"/>
        <polygon points="32,34 50,24 32,14 14,24" style="fill:#ffffff;stroke:#55aa00;stroke-width:3;stroke-linejoin:round"/>
    </g>
</svg>
