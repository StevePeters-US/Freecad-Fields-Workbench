    <circle cx="12" cy="12" r="3" style="fill:#ffffff;stroke:#ffaa00;stroke-width:1.5"/>
    <circle cx="32" cy="10" r="3" style="fill:#ffffff;stroke:#ffaa00;stroke-width:1.5"/>
