<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" version="1.1">
    <defs>
        <radialGradient id="boxGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e0e0e0"/>
        </radialGradient>
    </defs>
    <!-- Left Face -->
    <polygon points="32,54 14,44 14,24 32,34" style="fill:#b0b0b0;stroke:#ffaa00;stroke-width:2;stroke-linejoin:round"/>
    <!-- Right Face (Gradient Fill) -->
    <polygon points="32,54 50,44 50,24 32,34" style="fill:url(#boxGrad);stroke:#ffaa00;stroke-width:2;stroke-linejoin:round"/>
    <!-- Top Face (Highlight) -->
    <polygon points="32,34 50,24 32,14 14,24" style="fill:#ffffff;stroke:#ffaa00;stroke-width:2;stroke-linejoin:round"/>
</svg>
