<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" version="1.1">
  <!-- Translate to exactly center (32,32) instead of (32,16) -->
  <g transform="translate(32, 32) scale(1, 0.5) rotate(45)">
    <!-- Base Plane -->
    <rect x="-24" y="-24" width="48" height="48" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2" />
    <!-- Grid Lines -->
    <line x1="-12" y1="-24" x2="-12" y2="24" stroke="#7dd3fc" stroke-width="1" />
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#7dd3fc" stroke-width="1" />
    <line x1="12" y1="-24" x2="12" y2="24" stroke="#7dd3fc" stroke-width="1" />
    <line x1="-24" y1="-12" x2="24" y2="-12" stroke="#7dd3fc" stroke-width="1" />
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#7dd3fc" stroke-width="1" />
    <line x1="-24" y1="12" x2="24" y2="12" stroke="#7dd3fc" stroke-width="1" />
    
    <!-- Origin marker -->
    <circle cx="0" cy="0" r="3" fill="#0284c7" />
  </g>
</svg>
