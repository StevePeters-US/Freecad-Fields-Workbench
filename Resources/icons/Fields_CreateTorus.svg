<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" version="1.1">
    <defs>
        <radialGradient id="ringGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="65%" stop-color="#e0e0e0"/>
            <stop offset="100%" stop-color="#b0b0b0"/>
        </radialGradient>
        <linearGradient id="sideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#909090"/>
            <stop offset="100%" stop-color="#505050"/>
        </linearGradient>
    </defs>
    <!-- Outer Side Depth -->
    <path d="M 6 32 A 26 16 0 0 0 58 32 L 58 39 A 26 16 0 0 1 6 39 Z" 
          style="fill:url(#sideGrad);stroke:#ffaa00;stroke-width:2;stroke-linejoin:round"/>
    
    <!-- Top Surface Ring (Main Body) -->
    <path d="M 6 32 A 26 16 0 1 1 58 32 A 26 16 0 1 1 6 32 Z M 18 32 A 14 8 0 1 0 46 32 A 14 8 0 1 0 18 32 Z" 
          style="fill:url(#ringGrad);fill-rule:evenodd;stroke:#ffaa00;stroke-width:2;stroke-linejoin:round"/>
    
    <!-- Inner Hole Depth -->
    <path d="M 18 32 A 14 8 0 0 1 46 32 L 46 35 A 14 8 0 0 0 18 35 Z" 
          style="fill:#606060;stroke:#ffaa00;stroke-width:1;opacity:0.7"/>
    
    <!-- Top Specular Highlight -->
    <path d="M 12 28 Q 32 18 52 28" style="fill:none;stroke:#ffffff;stroke-width:2;stroke-linecap:round;opacity:0.5"/>
</svg>
