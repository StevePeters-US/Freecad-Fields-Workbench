<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#2d5fa6" opacity="0.15"/>
  <!-- Pencil body -->
  <rect x="28" y="10" width="8" height="36" rx="2" fill="#f5c842" stroke="#c89a10" stroke-width="1.5" transform="rotate(30 32 32)"/>
  <!-- Pencil tip -->
  <polygon points="32,50 28.5,60 35.5,60" fill="#e8765c" stroke="#c04a2a" stroke-width="1" transform="rotate(30 32 32)"/>
  <!-- Pencil eraser end -->
  <rect x="29" y="9" width="6" height="5" rx="1" fill="#e0a0a0" stroke="#c06060" stroke-width="1" transform="rotate(30 32 32)"/>
  <!-- Sketch lines (grid hint) -->
  <line x1="8" y1="52" x2="56" y2="52" stroke="#4488cc" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="8" y1="44" x2="40" y2="44" stroke="#4488cc" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.5"/>
</svg>
